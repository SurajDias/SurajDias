<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Suraj Dias — Software Engineer</title>
  <desc id="description">A restrained dark engineering banner with an animated system diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111B2A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#30363D" stop-opacity="0"/>
      <stop offset=".45" stop-color="#58A6FF" stop-opacity=".75"/>
      <stop offset="1" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#21262D" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="12" fill="url(#background)"/>
  <rect width="1200" height="360" rx="12" fill="url(#grid)" opacity=".45"/>

  <g stroke="url(#line)" stroke-width="1.25">
    <path d="M0 89H255L340 160H510"/>
    <path d="M1200 271H945L860 200H690"/>
    <path d="M78 286H250L340 200H485" opacity=".65"/>
    <path d="M1122 74H950L860 160H715" opacity=".65"/>
  </g>
  <g fill="#58A6FF" filter="url(#glow)">
    <circle cx="255" cy="89" r="3"/><circle cx="340" cy="160" r="3"/>
    <circle cx="945" cy="271" r="3"/><circle cx="860" cy="200" r="3"/>
  </g>
  <circle r="4" fill="#79C0FF" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M0,89 H255 L340,160 H510"/>
  </circle>
  <circle r="4" fill="#79C0FF" filter="url(#glow)">
    <animateMotion dur="6.5s" repeatCount="indefinite" path="M1200,271 H945 L860,200 H690"/>
  </circle>

  <g text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="600" y="157" fill="#F0F6FC" font-size="48" font-weight="700" letter-spacing="1">Suraj Dias</text>
    <text x="600" y="193" fill="#79C0FF" font-size="15" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER</text>
    <path d="M530 219H670" stroke="#58A6FF" stroke-width="1.5"/>
    <text x="600" y="251" fill="#8B949E" font-size="15">Systems-minded software · AI-enabled products · Clean engineering</text>
  </g>
</svg>
