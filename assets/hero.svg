<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="55%" stop-color="#070c1c"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6f4ff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#123054" stroke-width="0.5" opacity="0.35"/>
    </pattern>

    <pattern id="hexgrid" width="64" height="110" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M32 0 L64 18 L64 55 L32 73 L0 55 L0 18 Z" fill="none" stroke="#0f2846" stroke-width="0.6" opacity="0.4"/>
      <path d="M32 73 L64 91 L64 128 L32 146 L0 128 L0 91 Z" fill="none" stroke="#0f2846" stroke-width="0.6" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#hexgrid)" opacity="0.5"/>

  <!-- Vignette edges -->
  <rect width="1200" height="420" fill="#040711" opacity="0.0"/>
  <rect x="0" y="0" width="1200" height="420" fill="black" opacity="0.15" style="mix-blend-mode:multiply"/>

  <!-- Network topology: connecting lines -->
  <g stroke="#2a6f9e" stroke-width="1" opacity="0.55">
    <line x1="90" y1="70" x2="260" y2="140"/>
    <line x1="260" y1="140" x2="150" y2="250"/>
    <line x1="150" y1="250" x2="330" y2="330"/>
    <line x1="260" y1="140" x2="430" y2="90"/>
    <line x1="430" y1="90" x2="600" y2="60"/>
    <line x1="600" y1="60" x2="770" y2="95"/>
    <line x1="770" y1="95" x2="940" y2="55"/>
    <line x1="940" y1="55" x2="1100" y2="100"/>
    <line x1="1100" y1="100" x2="1150" y2="230"/>
    <line x1="1150" y1="230" x2="1020" y2="300"/>
    <line x1="1020" y1="300" x2="880" y2="345"/>
    <line x1="880" y1="345" x2="700" y2="360"/>
    <line x1="700" y1="360" x2="520" y2="345"/>
    <line x1="520" y1="345" x2="330" y2="330"/>
    <line x1="430" y1="90" x2="600" y2="200"/>
    <line x1="770" y1="95" x2="700" y2="360" opacity="0.3"/>
    <line x1="150" y1="250" x2="600" y2="200" opacity="0.3"/>
    <line x1="1020" y1="300" x2="600" y2="200" opacity="0.3"/>
  </g>

  <!-- Animated pulse traveling along a couple of key lines -->
  <g filter="url(#softGlow)">
    <circle r="2.4" fill="#7dd3fc">
      <animateMotion dur="4.5s" repeatCount="indefinite"
        path="M90,70 L260,140 L430,90 L600,60 L770,95 L940,55 L1100,100"/>
    </circle>
    <circle r="2.2" fill="#38bdf8">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M330,330 L520,345 L700,360 L880,345 L1020,300 L1150,230"/>
    </circle>
  </g>

  <!-- Nodes -->
  <g filter="url(#softGlow)">
    <g>
      <circle cx="90" cy="70" r="16" fill="url(#nodeGlow)"/>
      <circle cx="90" cy="70" r="3" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="260" cy="140" r="14" fill="url(#nodeGlow)"/>
      <circle cx="260" cy="140" r="2.6" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="150" cy="250" r="12" fill="url(#nodeGlow)"/>
      <circle cx="150" cy="250" r="2.4" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="330" cy="330" r="14" fill="url(#nodeGlow)"/>
      <circle cx="330" cy="330" r="2.6" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="430" cy="90" r="12" fill="url(#nodeGlow)"/>
      <circle cx="430" cy="90" r="2.4" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="600" cy="60" r="14" fill="url(#nodeGlow)"/>
      <circle cx="600" cy="60" r="2.6" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="600" cy="200" r="10" fill="url(#nodeGlow)" opacity="0.6"/>
      <circle cx="600" cy="200" r="2" fill="#bfe8ff" opacity="0.7"/>
    </g>
    <g>
      <circle cx="770" cy="95" r="12" fill="url(#nodeGlow)"/>
      <circle cx="770" cy="95" r="2.4" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="940" cy="55" r="14" fill="url(#nodeGlow)"/>
      <circle cx="940" cy="55" r="2.6" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="1100" cy="100" r="12" fill="url(#nodeGlow)"/>
      <circle cx="1100" cy="100" r="2.4" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="1150" cy="230" r="14" fill="url(#nodeGlow)"/>
      <circle cx="1150" cy="230" r="2.6" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="1020" cy="300" r="12" fill="url(#nodeGlow)"/>
      <circle cx="1020" cy="300" r="2.4" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="880" cy="345" r="12" fill="url(#nodeGlow)"/>
      <circle cx="880" cy="345" r="2.4" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="700" cy="360" r="14" fill="url(#nodeGlow)"/>
      <circle cx="700" cy="360" r="2.6" fill="#bfe8ff"/>
    </g>
    <g>
      <circle cx="520" cy="345" r="12" fill="url(#nodeGlow)"/>
      <circle cx="520" cy="345" r="2.4" fill="#bfe8ff"/>
    </g>
  </g>

  <!-- Node pulse animation on a few anchor nodes -->
  <circle cx="600" cy="60" r="4" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.8">
    <animate attributeName="r" values="4;22;4" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="360" r="4" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8">
    <animate attributeName="r" values="4;22;4" dur="4.1s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="4.1s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Thin blueprint corner brackets -->
  <g stroke="#38bdf8" stroke-width="1.4" opacity="0.55">
    <path d="M28 28 L28 60 M28 28 L60 28" fill="none"/>
    <path d="M1172 28 L1172 60 M1172 28 L1140 28" fill="none"/>
    <path d="M28 392 L28 360 M28 392 L60 392" fill="none"/>
    <path d="M1172 392 L1172 360 M1172 392 L1140 392" fill="none"/>
  </g>

  <!-- Center content backdrop panel -->
  <rect x="300" y="120" width="600" height="190" rx="4" fill="#050b18" opacity="0.35"/>

  <!-- Name -->
  <text x="600" y="205" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif"
        font-size="54" font-weight="700" letter-spacing="4" fill="url(#textGrad)" filter="url(#softGlow)">
    SURAJ DIAS
  </text>

  <!-- Role -->
  <text x="600" y="240" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif"
        font-size="18" font-weight="500" letter-spacing="6" fill="#8fb8d8">
    SOFTWARE ENGINEER
  </text>

  <!-- Tagline -->
  <text x="600" y="270" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif"
        font-size="14.5" font-weight="400" letter-spacing="1.2" fill="#5f89ab">
    Turning Ideas into Production-Ready Software
  </text>

  <!-- Divider -->
  <line x1="520" y1="288" x2="680" y2="288" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>

  <!-- Tech line -->
  <text x="600" y="308" text-anchor="middle" font-family="'JetBrains Mono','Consolas',monospace"
        font-size="13" letter-spacing="1.5" fill="#4c7699">
    Python • AI • React • FastAPI • Linux
  </text>
</svg>
